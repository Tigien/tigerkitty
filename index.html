<html lang="en-NZ"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger kitty</title>
<style>
  :root{
    --navy:#002a4d; --navy-2:#0c3a63; --orange:#f18101; --orange-soft:#fff3e4;
    --ink:#16202c; --muted:#5d6878; --line:#dde2e9; --app-bg:#eef1f5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--app-bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--orange);outline-offset:3px}

  /* Top bar (matches Invoice maker) */
  .topbar{background:var(--navy);color:#fff;box-shadow:0 2px 0 var(--orange)}
  .topbar-inner{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.2px}
  .brand span{color:var(--orange)}

  /* Hero */
  .hero{max-width:1100px;width:100%;margin:0 auto;padding:36px 16px 8px}
  .hero h1{margin:0 0 6px;font-size:28px;color:var(--navy)}
  .hero p{margin:0;color:var(--muted)}

  /* Link cards */
  main{flex:1}
  .grid{max-width:1100px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:16px;
        grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:#fff;border:1px solid var(--line);
        border-radius:12px;padding:18px;border-top:4px solid var(--orange);
        transition:transform .15s, box-shadow .15s, border-color .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,30,60,.10);border-color:var(--navy-2);border-top-color:var(--orange)}
  .card .icon{width:42px;height:42px;border-radius:10px;background:var(--orange-soft);color:var(--orange);
        display:flex;align-items:center;justify-content:center;font-size:22px}
  .card h2{margin:4px 0 0;font-size:17px;color:var(--navy)}
  .card p{margin:0;color:var(--muted);font-size:14px}
  .card .go{margin-top:auto;padding-top:6px;font-weight:700;color:var(--orange);font-size:14px}
  .card.soon{border-top-color:var(--line);opacity:.65;pointer-events:none}
  .card.soon .icon{background:#f1f3f6;color:var(--muted)}
  .card.soon .go{color:var(--muted)}

  footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px}
  footer div{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Tiger <span>kitty</span></div>
  </div>
</header>

<main>
  <nav class="grid" aria-label="Site sections">

    <a class="card" href="Invoice%20maker.html">
      <div class="icon" aria-hidden="true">🧾</div>
      <h2>Invoice maker</h2>
      <p>Create, save and print J &amp; T auto invoices.</p>
      <span class="go">Open →</span>
    </a>

    <a class="card" href="tax/refund/govt/GovttNz.html">
      <div class="icon" aria-hidden="true">💸</div>
      <h2>Get scammed</h2>
      <p>Get a tax refund</p>
      <span class="go">Open →</span>
    </a>

    <!--
      To add another part of the website, copy the block below,
      remove class="soon", and set href to the file name, e.g.:

      <a class="card" href="quotes.html">
        <div class="icon" aria-hidden="true">📋</div>
        <h2>Quotes</h2>
        <p>Short description of the page.</p>
        <span class="go">Open →</span>
      </a>
    -->

    <a class="card soon" href="#" aria-disabled="true" tabindex="-1">
      <div class="icon" aria-hidden="true">＋</div>
      <h2>More coming soon</h2>
      <p>New tools will appear here.</p>
      <span class="go">Not available yet</span>
    </a>

  </nav>
</main>

<footer>
  <div>
    <span>Tiger kitty</span>
    <span id="year">© 2026</span>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = '© ' + new Date().getFullYear();
</script>


</body></html>
