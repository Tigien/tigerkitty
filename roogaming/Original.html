<title>Duck Platformer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
/* Layout: full-bleed game canvas; hand-drawn HUD floats over it, touch pad pinned to bottom corners */
:root {
  --sky: #314d79;          /* Unity camera clear colour (0.192, 0.302, 0.475) */
  --paper: #fffdf7;
  --ink: #1d1b19;
  --pen-red: #e2231a;      /* the "Finish" marker red */
  --dirt: #b97b56;
  --shade: rgba(20, 24, 40, 0.55);
  --hand: "Patrick Hand", "Comic Neue", "Chalkboard SE", "Segoe Print", cursive;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--hand);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--sky); outline: none; }

.hud {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; z-index: 5;
}
.chip {
  font: 20px/1 var(--hand);
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 10px 14px 9px 13px;
  padding: 6px 12px 7px;
  cursor: pointer;
  box-shadow: 2px 3px 0 var(--ink);
}
.chip:active { transform: translate(2px, 3px); box-shadow: none; }
.chip:focus-visible, .pad button:focus-visible, .start button:focus-visible { outline: 3px dashed var(--pen-red); outline-offset: 3px; }

.start {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center;
  background: var(--shade);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 18px 26px 16px 24px;
  box-shadow: 5px 6px 0 var(--ink);
  padding: 22px 26px 24px;
  max-width: 360px; width: 100%;
  display: grid; gap: 14px;
  transform: rotate(-1deg);
}
.card h1 { margin: 0; font: 44px/1 var(--hand); text-wrap: balance; }
.card h1 span { color: var(--pen-red); }
.card p { margin: 0; font-size: 20px; line-height: 1.3; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 20px; align-items: center; }
kbd {
  font: 18px/1 var(--hand);
  border: 2px solid var(--ink); border-bottom-width: 4px;
  border-radius: 7px; padding: 3px 8px 2px; background: #fff; white-space: nowrap;
}
.start button {
  font: 28px/1 var(--hand);
  background: var(--dirt); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px 10px 16px 12px;
  padding: 10px 0 12px; cursor: pointer;
  box-shadow: 3px 4px 0 var(--ink);
}
.start button:active { transform: translate(3px, 4px); box-shadow: none; }

.pad { display: none; }
@media (pointer: coarse) {
  .pad {
    display: flex; position: fixed; z-index: 4;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    gap: 14px;
  }
  .pad.left { left: calc(16px + env(safe-area-inset-left, 0px)); }
  .pad.right { right: calc(16px + env(safe-area-inset-right, 0px)); }
  .pad button {
    width: 72px; height: 72px;
    font: 30px/1 var(--hand);
    color: var(--ink); background: rgba(255, 253, 247, 0.82);
    border: 3px solid var(--ink); border-radius: 50%;
    touch-action: none;
  }
  .pad button.on { background: var(--dirt); }
  .pad.right button { width: 96px; height: 96px; font-size: 26px; }
  .keys .desk { display: none; }
}
@media (pointer: fine) { .keys .touch { display: none; } }
@media (prefers-reduced-motion: reduce) { .card { transform: none; } }
</style>

<canvas id="game" tabindex="0" aria-label="Duck Platformer game"></canvas>

<div class="hud">
  <button class="chip" id="restart" type="button" title="Restart (R)">Restart</button>
</div>

<div class="pad left" aria-hidden="true">
  <button id="tLeft" type="button" tabindex="-1">◀</button>
  <button id="tRight" type="button" tabindex="-1">▶</button>
</div>
<div class="pad right" aria-hidden="true">
  <button id="tJump" type="button" tabindex="-1">Jump</button>
</div>

<div class="start" id="start">
  <div class="card">
    <h1>Duck Platformer <span>→ Finish</span></h1>
    <p>Hop across the ducks and reach the finish sign.</p>
    <div class="keys">
      <span class="desk"><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd></span><span class="desk">move</span>
      <span class="desk"><kbd>Space</kbd></span><span class="desk">jump (works mid-air too)</span>
      <span class="desk"><kbd>R</kbd></span><span class="desk">restart</span>
      <span class="touch">◀ ▶</span><span class="touch">move</span>
      <span class="touch">Jump</span><span class="touch">jump (works mid-air too)</span>
    </div>
    <button id="play" type="button">Play</button>
  </div>
</div>

  // ---- Character (Rigidbody2D + Jump.cs + PlayerMovement.cs) ----
  const CHAR = {
    start: [-12.1, 10.09],
    scale: [0.55661285, 0.528191],
    box: [-0.4709432, 0.3666532, 7.408571, 7.9035707],
    gravity: -9.81 * 3,      // Physics2D gravity × gravityScale 3
    jumpAmount: 22,          // ForceMode2D.Impulse on mass 1 → +22 m/s
    speed: 10,               // transform.Translate(axis * speed * dt)
  };
  const bOff = [CHAR.box[0] * CHAR.scale[0], CHAR.box[1] * CHAR.scale[1]];
  const bHalf = [CHAR.box[2] * CHAR.scale[0] / 2, CHAR.box[3] * CHAR.scale[1] / 2];
  const CAM_OFF = [0.22 * CHAR.scale[0], 0.6 * CHAR.scale[1]]; // Main Camera is a child of Character
  const ORTHO = 10.114485;
  const FIXED = 0.02, MAX_DT = 0.1;

  const st = { x: CHAR.start[0], y: CHAR.start[1], vy: 0, axis: 0, jumps: 0, acc: 0 };
  function reset() { st.x = CHAR.start[0]; st.y = CHAR.start[1]; st.vy = 0; st.axis = 0; st.jumps = 0; st.acc = 0; }

  // Push the character's box out of any overlapping collider along the shallowest axis
  function resolve() {
    for (let it = 0; it < 4; it++) {
      let moved = false;
      const cx = st.x + bOff[0], cy = st.y + bOff[1];
      for (const s of solids) {
        const dx = cx - s.cx, dy = cy - s.cy;
        const px = bHalf[0] + s.hw - Math.abs(dx);
        const py = bHalf[1] + s.hh - Math.abs(dy);
        if (px <= 1e-6 || py <= 1e-6) continue;
        if (px < py) {
          st.x += dx < 0 ? -px : px;
        } else {
          if (dy > 0) { st.y += py; if (st.vy < 0) st.vy = 0; }
          else { st.y -= py; if (st.vy > 0) st.vy = 0; }
        }
        moved = true;
        break;
      }
      if (!moved) return;
    }
  }

  function physicsStep(dt) {
    if (st.jumps) { st.vy += CHAR.jumpAmount * st.jumps; st.jumps = 0; }
    st.vy += CHAR.gravity * dt;
    // Sub-step so fast falls or stacked jumps don't tunnel through thin ducks
    const dy = st.vy * dt;
    const n = Math.max(1, Math.ceil(Math.abs(dy) / 0.4));
    for (let i = 0; i < n; i++) { st.y += dy / n; resolve(); }
    if (st.y < -400) reset(); // fell off the end of the world
  }

  // ---- Input (Unity "Horizontal" axis: sensitivity 3, gravity 3, snap) ----
  const keys = new Set();
  const touch = { l: false, r: false };
  let padJumpWas = false;
  function axisTarget() {
    let pos = keys.has("ArrowRight") || keys.has("KeyD") || touch.r;
    let neg = keys.has("ArrowLeft") || keys.has("KeyA") || touch.l;
    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
    if (gp) {
      const ax = gp.axes[0] || 0;
      if (ax > 0.19) pos = true; else if (ax < -0.19) neg = true;
      if (gp.buttons[15]?.pressed) pos = true;
      if (gp.buttons[14]?.pressed) neg = true;
      const j = !!gp.buttons[0]?.pressed;
      if (j && !padJumpWas && running) st.jumps++;
      padJumpWas = j;
    }
    return pos === neg ? 0 : (pos ? 1 : -1);
  }
  function moveTowards(v, t, d) { return Math.abs(t - v) <= d ? t : v + Math.sign(t - v) * d; }

  let running = false;
  function jump() { if (running) st.jumps++; }

  addEventListener("keydown", e => {
    if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
    if (!running && (e.code === "Space" || e.code === "Enter")) { begin(); return; }
    if (e.code === "Space" && !e.repeat) jump();
    if (e.code === "KeyR" && !e.repeat && running) reset();
    keys.add(e.code);
  });
  addEventListener("keyup", e => keys.delete(e.code));
  addEventListener("blur", () => { keys.clear(); touch.l = touch.r = false; });

  function holdButton(el, key) {
    const on = e => { e.preventDefault(); touch[key] = true; el.classList.add("on"); el.setPointerCapture?.(e.pointerId); };
    const off = () => { touch[key] = false; el.classList.remove("on"); };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("lostpointercapture", off);
  }
  holdButton(document.getElementById("tLeft"), "l");
  holdButton(document.getElementById("tRight"), "r");
  const tJump = document.getElementById("tJump");
  tJump.addEventListener("pointerdown", e => { e.preventDefault(); tJump.classList.add("on"); jump(); });
  tJump.addEventListener("pointerup", () => tJump.classList.remove("on"));
  tJump.addEventListener("pointercancel", () => tJump.classList.remove("on"));

  const canvas = document.getElementById("game");
  const startEl = document.getElementById("start");
  function begin() {
    if (running) return;
    running = true; startEl.hidden = true; canvas.focus({ preventScroll: true });
  }
  document.getElementById("play").addEventListener("click", begin);
  document.getElementById("restart").addEventListener("click", e => { reset(); e.currentTarget.blur(); canvas.focus({ preventScroll: true }); });
  canvas.addEventListener("pointerdown", () => canvas.focus({ preventScroll: true }));

  // ---- Rendering (orthographic camera, vertical half-size 10.114) ----
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
    canvas.width = W; canvas.height = H;
  }
  addEventListener("resize", resize); resize();

  const drawList = [...scene.map(e => ({ ...e })), { s: "char", o: 10, isChar: true }]
    .map((e, i) => ({ e, i })).sort((a, b) => a.e.o - b.e.o || a.i - b.i).map(x => x.e);

  function drawSprite(img, wx, wy, sx, sy, size, cam, ppu) {
    if (!img.naturalWidth) return;
    const w = size[0] * Math.abs(sx), h = size[1] * Math.abs(sy);
    const flipX = sx < 0, flipY = sy < 0;
    const halfW = W / 2 / ppu, halfH = H / 2 / ppu;
    // Visible part of the sprite in world units (clip huge stretched sprites to the view)
    const L = Math.max(wx - w / 2, cam[0] - halfW - 1), R = Math.min(wx + w / 2, cam[0] + halfW + 1);
    const T = Math.min(wy + h / 2, cam[1] + halfH + 1), B = Math.max(wy - h / 2, cam[1] - halfH - 1);
    if (L >= R || B >= T) return;
    const u0 = (L - (wx - w / 2)) / w, u1 = (R - (wx - w / 2)) / w;
    const v0 = ((wy + h / 2) - T) / h, v1 = ((wy + h / 2) - B) / h;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    let srcX = (flipX ? 1 - u1 : u0) * iw, srcW = (u1 - u0) * iw;
    let srcY = (flipY ? 1 - v1 : v0) * ih, srcH = (v1 - v0) * ih;
    srcX = Math.max(0, Math.min(iw - 0.01, srcX)); srcW = Math.max(0.01, Math.min(iw - srcX, srcW));
    srcY = Math.max(0, Math.min(ih - 0.01, srcY)); srcH = Math.max(0.01, Math.min(ih - srcY, srcH));
    const dx = (L - cam[0]) * ppu + W / 2, dy = H / 2 - (T - cam[1]) * ppu;
    const dw = (R - L) * ppu, dh = (T - B) * ppu;
    ctx.save();
    ctx.translate(dx + dw / 2, dy + dh / 2);
    ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    ctx.drawImage(img, srcX, srcY, srcW, srcH, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  }

  function render() {
    const ppu = H / (2 * ORTHO);
    const cam = [st.x + CAM_OFF[0], st.y + CAM_OFF[1]];
    ctx.fillStyle = "#314d79";
    ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    for (const e of drawList) {
      if (e.isChar) drawSprite(IMG.char, st.x, st.y, CHAR.scale[0], CHAR.scale[1], SPR.char, cam, ppu);
      else drawSprite(IMG[e.s], e.p[0], e.p[1], e.k[0], e.k[1], SPR[e.s], cam, ppu);
    }
  }

  // ---- Main loop: Unity order (FixedUpdate steps, then Update) ----
  let last = performance.now();
  function frame(now) {
    let dt = Math.min((now - last) / 1000, MAX_DT); last = now;
    if (running) {
      st.acc += dt;
      let steps = 0;
      while (st.acc >= FIXED && steps < 8) { physicsStep(FIXED); st.acc -= FIXED; steps++; }
      if (steps === 8) st.acc = 0;
      const t = axisTarget();
      if (t !== 0) {
        if (st.axis !== 0 && Math.sign(st.axis) !== t) st.axis = 0; // snap
        st.axis = moveTowards(st.axis, t, 3 * dt);
      } else st.axis = moveTowards(st.axis, 0, 3 * dt);
      if (st.axis) { st.x += st.axis * CHAR.speed * dt; resolve(); }
    }
    render();
    requestAnimationFrame(frame);
  }

  // Keep the player's place if the page is updated while open
  window.claude?.hot?.snapshot?.(() => ({ x: st.x, y: st.y, vy: st.vy, running }));
  function boot(data) {
    if (data && typeof data.x === "number") { st.x = data.x; st.y = data.y; st.vy = data.vy || 0; if (data.running) begin(); }
    Promise.all(loads).then(() => requestAnimationFrame(t => { last = t; frame(t); }));
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
