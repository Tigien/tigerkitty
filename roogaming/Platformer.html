<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duck Platformer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<style>
/* Layout: full-bleed game canvas over a Win95 sticky-note wall; hand-drawn HUD floats on top, touch pad pinned to bottom corners */
:root {
  --desk: #008080;         /* Windows 95 desktop teal, behind the notes */
  --paper: #fffdf7;
  --ink: #1d1b19;
  --pen-red: #e2231a;
  --dirt: #b97b56;
  --gold: #f6c343;
  --shade: rgba(10, 30, 34, 0.55);
  --hand: "Patrick Hand", "Comic Neue", "Comic Sans MS", "Chalkboard SE", cursive;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--hand);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--desk); outline: none; }

.hud {
  position: fixed; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: calc(12px + env(safe-area-inset-left, 0px));
  right: calc(12px + env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.chip {
  font: 20px/1 var(--hand);
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 10px 14px 9px 13px;
  padding: 6px 12px 7px;
  box-shadow: 2px 3px 0 var(--ink);
}
button.chip { cursor: pointer; }
button.chip:active { transform: translate(2px, 3px); box-shadow: none; }
.timer { font-size: 24px; min-width: 5.2em; text-align: center; font-variant-numeric: tabular-nums; }
.timer.done { background: var(--gold); }
.chip:focus-visible, .pad button:focus-visible, .overlay button:focus-visible { outline: 3px dashed var(--pen-red); outline-offset: 3px; }

.overlay {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center;
  background: var(--shade);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.overlay.clear { background: transparent; pointer-events: none; place-items: start center; padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
.overlay.clear .card { pointer-events: auto; }
.card {
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 18px 26px 16px 24px;
  box-shadow: 5px 6px 0 var(--ink);
  padding: 22px 26px 24px;
  max-width: 360px; width: 100%;
  display: grid; gap: 14px;
  transform: rotate(-1deg);
}
.card h1 { margin: 0; font: 44px/1 var(--hand); text-wrap: balance; }
.card h1 span { color: var(--pen-red); }
.card p { margin: 0; font-size: 20px; line-height: 1.3; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 20px; align-items: center; }
kbd {
  font: 18px/1 var(--hand);
  border: 2px solid var(--ink); border-bottom-width: 4px;
  border-radius: 7px; padding: 3px 8px 2px; background: #fff; white-space: nowrap;
}
.overlay button.big {
  font: 28px/1 var(--hand);
  background: var(--dirt); color: var(--ink);
  border: 3px solid var(--ink); border-radius: 14px 10px 16px 12px;
  padding: 10px 0 12px; cursor: pointer;
  box-shadow: 3px 4px 0 var(--ink);
}
.overlay button.big:active { transform: translate(3px, 4px); box-shadow: none; }
.result { display: grid; gap: 2px; }
.result .label { font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; }
.result .time { font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.best { display: flex; justify-content: space-between; align-items: center; font-size: 20px; gap: 10px; }
.tag {
  font-size: 18px; background: var(--gold); border: 2px solid var(--ink);
  border-radius: 8px 11px 7px 10px; padding: 2px 8px 3px; transform: rotate(2deg);
}
.hint { font-size: 16px; opacity: 0.7; text-align: center; }

.pad { display: none; }
@media (pointer: coarse) {
  .pad {
    display: flex; position: fixed; z-index: 4;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    gap: 14px;
  }
  .pad.left { left: calc(16px + env(safe-area-inset-left, 0px)); }
  .pad.right { right: calc(16px + env(safe-area-inset-right, 0px)); }
  .pad button {
    width: 72px; height: 72px;
    font: 30px/1 var(--hand);
    color: var(--ink); background: rgba(255, 253, 247, 0.85);
    border: 3px solid var(--ink); border-radius: 50%;
    touch-action: none;
  }
  .pad button.on { background: var(--dirt); }
  .pad.right button { width: 96px; height: 96px; font-size: 26px; }
  .desk-only { display: none; }
}
@media (pointer: fine) { .touch-only { display: none; } }
@media (prefers-reduced-motion: reduce) { .card, .tag { transform: none; } }
</style>

<canvas id="game" tabindex="0" aria-label="Duck Platformer game"></canvas>

<div class="hud">
  <div class="chip timer" id="timer" aria-live="off">0:00.00</div>
  <button class="chip" id="restart" type="button" title="Restart (R)">Restart</button>
</div>

<div class="pad left" aria-hidden="true">
  <button id="tLeft" type="button" tabindex="-1">◀</button>
  <button id="tRight" type="button" tabindex="-1">▶</button>
</div>
<div class="pad right" aria-hidden="true">
  <button id="tJump" type="button" tabindex="-1">Jump</button>
</div>

<div class="overlay" id="start">
  <div class="card">
    <h1>Duck Platformer <span>→ Finish</span></h1>
    <p>Climb over the blobs and race to the checkered finish line. The clock starts when you press Play.</p>
    <div class="keys">
      <span class="desk-only"><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd></span><span class="desk-only">run</span>
      <span class="desk-only"><kbd>Space</kbd></span><span class="desk-only">jump (from the ground)</span>
      <span class="desk-only"><kbd>R</kbd></span><span class="desk-only">restart</span>
      <span class="touch-only">◀ ▶</span><span class="touch-only">run</span>
      <span class="touch-only">Jump</span><span class="touch-only">jump (from the ground)</span>
    </div>
    <button class="big" id="play" type="button">Play</button>
  </div>
</div>

<div class="overlay clear" id="finish" hidden>
  <div class="card" role="dialog" aria-labelledby="finishTitle">
    <h1 id="finishTitle">You finished!</h1>
    <div class="result">
      <span class="label">Your time</span>
      <span class="time" id="finalTime">0:00.00</span>
    </div>
    <div class="best">
      <span id="bestLine">Best: –</span>
      <span class="tag" id="newBest" hidden>New best!</span>
    </div>
    <button class="big" id="again" type="button">Play again</button>
    <div class="hint desk-only">or press Enter</div>
  </div>
</div>

    [98.56, 107.3, 24.29, 29.65], [98.99, 106.3, 0.3, 13.0], [112.44, 121.18, 15.39, 20.75],
    [122.71, 131.45, 0.3, 7.0], [135.8, 138.5, 0.3, 7.0], [138.43, 142.63, 0.3, 13.5],
  ];
  const FLOOR_TOP = 0.636;
  const FINISH_X = 178;
  const COLORS = ["#e53935", "#8e44ad", "#f39c12", "#43a047", "#a1122e"]; // red, purple, orange, green, crimson

  const solids = [
    ...dirts.map(e => ({
      cx: e.p[0] + e.box[0] * e.k[0], cy: e.p[1] + e.box[1] * e.k[1],

    })),
    ...OBST.map(([x0, x1, y0, y1]) => ({ cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, hw: (x1 - x0) / 2, hh: (y1 - y0) / 2 })),

  const blobs = OBST.map(([x0, x1, y0, y1], i) => {
    const r = rng(i * 7919 + 13);
    const w = x1 - x0, h = y1 - y0;
    const rad = Math.max(0.3, Math.min(1.6, Math.min(w, h) * 0.2));
    const pts = [];
    const per = 2 * (w + h);
    const n = Math.max(24, Math.min(260, Math.round(per / 0.55)));
    const wob = Math.min(0.09, Math.min(w, h) * 0.02 + 0.03);
    for (let k = 0; k < n; k++) {
      const t = k / n * per;
      let x, y, nx, ny;
      if (t < w) { x = x0 + t; y = y1; nx = 0; ny = 1; }
      else if (t < w + h) { x = x1; y = y1 - (t - w); nx = 1; ny = 0; }
      else if (t < 2 * w + h) { x = x1 - (t - w - h); y = y0; nx = 0; ny = -1; }

    const faceSize = Math.min(2.4, s * 0.32);
    const faceY = Math.min(y1 - faceSize * 1.1, y0 + h * 0.62);
    return {
      x0, x1, y0, y1, w, h, pts,
      color: COLORS[i % COLORS.length],
      face: s > 1.2 ? { x: (x0 + x1) / 2 + (r() - 0.5) * w * 0.15, y: faceY, s: faceSize, mouth: Math.floor(r() * 3), blink: r() * 5 } : null,
      ears: s > 2.2 && r() < 0.45,

  // ---------- Character ----------
  const CHAR = {
    start: [-12.1, 10.09],
    scale: [0.55661285, 0.528191],
    box: [-0.4709432, 0.3666532, 7.408571, 7.9035707],
    gravity: -9.81 * 3,
    jumpSpeed: 22,           // Jump.cs impulse 22 on a 1 kg body
    speed: 10,
  };
  const bOff = [CHAR.box[0] * CHAR.scale[0], CHAR.box[1] * CHAR.scale[1]];
  const bHalf = [CHAR.box[2] * CHAR.scale[0] / 2, CHAR.box[3] * CHAR.scale[1] / 2];
  const CAM_OFF = [0.22 * CHAR.scale[0], 0.6 * CHAR.scale[1]];
  const ORTHO = 10.114485;
  const FIXED = 0.02, MAX_DT = 0.1;
  const COYOTE = 0.08, BUFFER = 0.12;

  const st = {
    x: 0, y: 0, vy: 0, axis: 0, grounded: false, coyote: 0, buffer: 0,
    time: 0, acc: 0, finished: false,
    phase: 0, dir: 1, air: 0, t: 0,
    camX: 0, camY: 0, look: 0,
  };
  let confetti = [];

  function snapCamera() { st.camX = st.x + CAM_OFF[0]; st.camY = st.y + CAM_OFF[1]; st.look = 0; }
  function reset() {
    Object.assign(st, { x: CHAR.start[0], y: CHAR.start[1], vy: 0, axis: 0, grounded: false, coyote: 0, buffer: 0, time: 0, acc: 0, finished: false, phase: 0, air: 0 });

    confetti = [];

  }

  function overlaps(cx, cy, hw, hh, s) { return Math.abs(cx - s.cx) < hw + s.hw - 1e-6 && Math.abs(cy - s.cy) < hh + s.hh - 1e-6; }
  function resolve() {
    for (let it = 0; it < 4; it++) {

      const cx = st.x + bOff[0], cy = st.y + bOff[1];
      for (const s of solids) {
        const dx = cx - s.cx, dy = cy - s.cy;
        const px = bHalf[0] + s.hw - Math.abs(dx);
        const py = bHalf[1] + s.hh - Math.abs(dy);
        if (px <= 1e-6 || py <= 1e-6) continue;
        if (px < py) st.x += dx < 0 ? -px : px;
        else if (dy > 0) { st.y += py; if (st.vy < 0) st.vy = 0; }

      }
      if (!moved) return;
    }
  }
  function onGround() {
    // Thin probe under the feet (the scene's old GroundCheck object did this job)

    return solids.some(s => overlaps(cx, cy, bHalf[0] * 0.9, 0.05, s));
  }

  function physicsStep(dt) {

    }
    st.buffer = Math.max(0, st.buffer - dt);
    st.vy += CHAR.gravity * dt;
    const dy = st.vy * dt;
    const n = Math.max(1, Math.ceil(Math.abs(dy) / 0.4));
    for (let i = 0; i < n; i++) { st.y += dy / n; resolve(); }

  }

  // ---------- Input ----------
  const keys = new Set();
  const touch = { l: false, r: false, j: false };
  function jumpHeld() { return keys.has("Space") || keys.has("ArrowUp") || keys.has("KeyW") || touch.j || padJumpWas; }
  let padJumpWas = false;
  let running = false;
  function axisTarget() {
    let pos = keys.has("ArrowRight") || keys.has("KeyD") || touch.r;

    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
    if (gp) {
      const ax = gp.axes[0] || 0;
      if (ax > 0.19) pos = true; else if (ax < -0.19) neg = true;
      if (gp.buttons[15]?.pressed) pos = true;
      if (gp.buttons[14]?.pressed) neg = true;
      const j = !!gp.buttons[0]?.pressed;
      if (j && !padJumpWas) jump();
      padJumpWas = j;
    }
    return pos === neg ? 0 : (pos ? 1 : -1);
  }
  function moveTowards(v, t, d) { return Math.abs(t - v) <= d ? t : v + Math.sign(t - v) * d; }
  function jump() { if (running && !st.finished) st.buffer = BUFFER; }

  const canvas = document.getElementById("game");
  const startEl = document.getElementById("start");
  const finishEl = document.getElementById("finish");
  const timerEl = document.getElementById("timer");
  const focusGame = () => canvas.focus({ preventScroll: true });

  addEventListener("keydown", e => {
    if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
    if (!running && (e.code === "Space" || e.code === "Enter")) { begin(); return; }
    if (st.finished && (e.code === "Enter" || e.code === "KeyR") && !e.repeat) { e.preventDefault(); reset(); focusGame(); return; }
    if ((e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") && !e.repeat) jump();

  addEventListener("keyup", e => keys.delete(e.code));
  addEventListener("blur", () => { keys.clear(); touch.l = touch.r = touch.j = false; });

  function holdButton(el, key) {
    const on = e => { e.preventDefault(); touch[key] = true; el.classList.add("on"); el.setPointerCapture?.(e.pointerId); };
    const off = () => { touch[key] = false; el.classList.remove("on"); };

    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("lostpointercapture", off);

  holdButton(document.getElementById("tLeft"), "l");
  holdButton(document.getElementById("tRight"), "r");
  const tJump = document.getElementById("tJump");
  tJump.addEventListener("pointerdown", e => { e.preventDefault(); touch.j = true; tJump.classList.add("on"); tJump.setPointerCapture?.(e.pointerId); jump(); });
  tJump.addEventListener("pointerup", () => { touch.j = false; tJump.classList.remove("on"); });
  tJump.addEventListener("lostpointercapture", () => { touch.j = false; tJump.classList.remove("on"); });
  tJump.addEventListener("pointercancel", () => { touch.j = false; tJump.classList.remove("on"); });

  document.getElementById("again").addEventListener("click", () => { reset(); focusGame(); });
  document.getElementById("restart").addEventListener("click", e => { if (running) reset(); e.currentTarget.blur(); focusGame(); });

  // ---------- Timer + finish ----------
  function fmt(t) {

  }
  function loadBest() { try { const v = parseFloat(localStorage.getItem("duckPlatformerBest")); return isFinite(v) ? v : null; } catch { return null; } }
  function saveBest(v) { try { localStorage.setItem("duckPlatformerBest", String(v)); } catch {} }

    document.getElementById("finalTime").textContent = fmt(st.time);
    document.getElementById("bestLine").textContent = "Best: " + fmt(isBest ? st.time : best);
    document.getElementById("newBest").hidden = !isBest;
    timerEl.textContent = fmt(st.time);
    timerEl.classList.add("done");
    finishEl.hidden = false;

          x: FINISH_X + (r() - 0.5) * 2, y: FLOOR_TOP + 11 + (r() - 0.5) * 2,
          vx: (r() - 0.5) * 26, vy: 8 + r() * 22, rot: r() * 6, vr: (r() - 0.5) * 14,

    }
  }

  // ---------- Rendering ----------
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1, PPU = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
    canvas.width = W; canvas.height = H;
    PPU = H / (2 * ORTHO);
    buildNotes();
  }

  // Windows 95 sticky-note windows, prerendered once per screen size
  const NOTE_COLORS = ["#fff68f", "#ffb7d5", "#b8f5b0", "#a9dcff", "#ffd59a", "#d8c2ff"];
  const MEMOS = [
    ["buy more", "ducks"], ["TODO:", "finish line"], ["jump!!"], ["call mum", "after 5"], ["milk", "eggs", "bread"],
    ["meeting", "@ 3pm"], ["SAVE", "OFTEN"], ["C:\\GAMES\\", "DUCK.EXE"], ["hop hop", "hop"], ["ctrl+alt+del"],
    ["no double", "jumping!"], ["back in", "5 min"], ["56k", "dial-up", "pw: ****"], ["dont fall"], [":)"], ["level 1", "beat it"],
  ];
  const TITLES = ["Sticky Note", "Note", "untitled", "Memo", "Notes - 1", "Reminder"];
  const NOTE_CELL = [6.6, 5.8];
  function buildNotes() {
    notes = [];
    const px = Math.max(1, Math.round(dpr));
    for (let v = 0; v < 24; v++) {
      const r = rng(v * 4099 + 7);
      const wU = 4.6 + r() * 1.5, hU = 3.7 + r() * 1.3;

      g.fillStyle = "#c0c0c0"; g.fillRect(0, 0, w, h);
      const bevel = (x, y, ww, hh, tl, br, t) => {
        g.fillStyle = tl; g.fillRect(x, y, ww, t); g.fillRect(x, y, t, hh);
        g.fillStyle = br; g.fillRect(x, y + hh - t, ww, t); g.fillRect(x + ww - t, y, t, hh);

      const pad = 3 * px;

      g.fillRect(pad, pad, w - 2 * pad, tbH);

      g.textBaseline = "middle";

      g.fillRect(cx + px, cy + px, cw - 2 * px, ch - 2 * px);
      // memo text
      const memo = MEMOS[v % MEMOS.length];
      const fs = Math.round(Math.min(ch / 4.2, 0.62 * PPU));
      g.fillStyle = "#3a3a3a";
      g.font = `${fs}px "Comic Sans MS", "Comic Neue", "Patrick Hand", cursive`;
      g.textBaseline = "top";

  }
  addEventListener("resize", resize);

  const toSX = (wx) => (wx - st.camX) * PPU + W / 2;
  const toSY = (wy) => H / 2 - (wy - st.camY) * PPU;

  function drawWall() {
    ctx.fillStyle = "#008080";
    ctx.fillRect(0, 0, W, H);
    const halfW = W / 2 / PPU, halfH = H / 2 / PPU;
    const i0 = Math.floor((st.camX - halfW) / NOTE_CELL[0]) - 1, i1 = Math.ceil((st.camX + halfW) / NOTE_CELL[0]);
    const j0 = Math.floor((st.camY - halfH) / NOTE_CELL[1]) - 1, j1 = Math.ceil((st.camY + halfH) / NOTE_CELL[1]);
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const h = hash2(i, j);
        if ((h & 15) < 2) continue; // a few gaps show the desktop
        const n = notes[h % notes.length];
        const ox = ((h >>> 8) & 255) / 255 * 1.4 - 0.7, oy = ((h >>> 16) & 255) / 255 * 1.2 - 0.6;
        const x = toSX(i * NOTE_CELL[0] + ox), y = toSY((j + 1) * NOTE_CELL[1] + oy);
        ctx.drawImage(n, Math.round(x), Math.round(y));
      }
    }
    // knock the wall back so the level reads first
    ctx.fillStyle = "rgba(0, 70, 80, 0.28)";
    ctx.fillRect(0, 0, W, H);
  }

  function drawSprite(img, wx, wy, sx, sy, size) {
    if (!img.naturalWidth) return;
    const w = size[0] * Math.abs(sx), h = size[1] * Math.abs(sy);
    const flipX = sx < 0, flipY = sy < 0;
    const halfW = W / 2 / PPU, halfH = H / 2 / PPU;
    const L = Math.max(wx - w / 2, st.camX - halfW - 1), R = Math.min(wx + w / 2, st.camX + halfW + 1);
    const T = Math.min(wy + h / 2, st.camY + halfH + 1), B = Math.max(wy - h / 2, st.camY - halfH - 1);
    if (L >= R || B >= T) return;
    const u0 = (L - (wx - w / 2)) / w, u1 = (R - (wx - w / 2)) / w;
    const v0 = ((wy + h / 2) - T) / h, v1 = ((wy + h / 2) - B) / h;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    let srcX = (flipX ? 1 - u1 : u0) * iw, srcW = (u1 - u0) * iw;
    let srcY = (flipY ? 1 - v1 : v0) * ih, srcH = (v1 - v0) * ih;
    srcX = Math.max(0, Math.min(iw - 0.01, srcX)); srcW = Math.max(0.01, Math.min(iw - srcX, srcW));
    srcY = Math.max(0, Math.min(ih - 0.01, srcY)); srcH = Math.max(0.01, Math.min(ih - srcY, srcH));
    const dx = toSX(L), dy = toSY(T), dw = (R - L) * PPU, dh = (T - B) * PPU;
    ctx.save();
    ctx.translate(dx + dw / 2, dy + dh / 2);
    ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    ctx.drawImage(img, srcX, srcY, srcW, srcH, -dw / 2, -dh / 2, dw, dh);
    ctx.restore();
  }

  const INK = "#151312";
  function drawBlob(b) {
    const halfW = W / 2 / PPU, halfH = H / 2 / PPU;
    if (b.x1 < st.camX - halfW - 3 || b.x0 > st.camX + halfW + 3 || b.y1 < st.camY - halfH - 3 || b.y0 > st.camY + halfH + 3) return;
    const lw = Math.max(1.5, 0.11 * PPU);
    ctx.lineJoin = "round"; ctx.lineCap = "round";

    if (b.arms) {
      const sway = Math.sin(st.t * 2.2 + b.phase) * 0.35;
      const ay = b.y0 + b.h * 0.45;
      ctx.strokeStyle = INK; ctx.lineWidth = lw;
      for (const side of [-1, 1]) {
        const sx = side < 0 ? b.x0 + 0.1 : b.x1 - 0.1;
        const ex = sx + side * 1.3, ey = ay + 0.35 + sway * side;

        ctx.moveTo(toSX(sx), toSY(ay)); ctx.lineTo(toSX(ex), toSY(ey)); ctx.lineTo(toSX(hx), toSY(hy));
        ctx.moveTo(toSX(hx), toSY(hy)); ctx.lineTo(toSX(hx + side * 0.35), toSY(hy + 0.35));
        ctx.moveTo(toSX(hx), toSY(hy)); ctx.lineTo(toSX(hx + side * 0.05), toSY(hy + 0.5));
        ctx.moveTo(toSX(hx), toSY(hy)); ctx.lineTo(toSX(hx + side * 0.45), toSY(hy - 0.1));

      }
    }
    if (b.ears) {
      for (const side of [-1, 1]) {
        const ex = (b.x0 + b.x1) / 2 + side * b.w * 0.3, ey = b.y1 - 0.2;
        ctx.beginPath();
        ctx.ellipse(toSX(ex + side * 0.35), toSY(ey + 0.55), 0.45 * PPU, 0.8 * PPU, side * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = "#b47a52"; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
      }
    }
    ctx.beginPath();
    b.pts.forEach(([x, y], k) => (k ? ctx.lineTo(toSX(x), toSY(y)) : ctx.moveTo(toSX(x), toSY(y))));
    ctx.closePath();
    ctx.fillStyle = b.color; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
    if (b.face) {
      const f = b.face, s = f.s;
      ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, lw * 0.9);
      const blinking = ((st.t + f.blink) % 5) < 0.12;
      ctx.beginPath();
      for (const side of [-1, 1]) {
        const ex = f.x + side * s * 0.32, ey = f.y + s * 0.25;

      ctx.beginPath();
      const mx = f.x, my = f.y - s * 0.12;
      if (f.mouth === 0) { // smile like the hero's
        ctx.moveTo(toSX(mx - s * 0.25), toSY(my + s * 0.06));
        ctx.lineTo(toSX(mx - s * 0.15), toSY(my - s * 0.08));
        ctx.quadraticCurveTo(toSX(mx + s * 0.1), toSY(my - s * 0.08), toSX(mx + s * 0.3), toSY(my + s * 0.08));
      } else if (f.mouth === 1) { // flat
        ctx.moveTo(toSX(mx - s * 0.2), toSY(my)); ctx.lineTo(toSX(mx + s * 0.22), toSY(my + s * 0.03));
      } else { // "o"
        ctx.ellipse(toSX(mx), toSY(my), s * 0.09 * PPU, s * 0.12 * PPU, 0, 0, Math.PI * 2);
      }
      ctx.stroke();
    }
  }

  function drawFinish() {
    const halfW = W / 2 / PPU;
    if (Math.abs(FINISH_X - st.camX) > halfW + 8) return;
    const lw = Math.max(1.5, 0.11 * PPU);
    const sq = 0.7;
    // checkered strip across the ground
    const x0 = FINISH_X - sq, top = FLOOR_TOP + 0.02, rows = 4;
    for (let r = 0; r < rows; r++) for (let c = 0; c < 2; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#ffffff" : "#111111";
      ctx.fillRect(toSX(x0 + c * sq), toSY(top - r * sq), sq * PPU + 0.5, sq * PPU + 0.5);
    }
    ctx.strokeStyle = INK; ctx.lineWidth = lw;
    ctx.strokeRect(toSX(x0), toSY(top), 2 * sq * PPU, rows * sq * PPU);
    // post
    const px0 = FINISH_X - 0.28, pTop = FLOOR_TOP + 10;
    ctx.fillStyle = "#b47a52";
    ctx.beginPath(); ctx.rect(toSX(px0), toSY(pTop), 0.56 * PPU, (pTop - FLOOR_TOP) * PPU); ctx.fill(); ctx.stroke();
    // little "Finish" note pinned to the post, like the original sign
    ctx.save();
    ctx.translate(toSX(FINISH_X + 0.9), toSY(FLOOR_TOP + 5.2));
    ctx.rotate(-0.06);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-0.2 * PPU, -0.75 * PPU, 3.6 * PPU, 1.5 * PPU);
    ctx.strokeRect(-0.2 * PPU, -0.75 * PPU, 3.6 * PPU, 1.5 * PPU);
    ctx.fillStyle = "#e2231a"; ctx.textBaseline = "middle";
    ctx.font = `${Math.round(1.05 * PPU)}px "Patrick Hand", "Comic Sans MS", cursive`;
    ctx.fillText("Finish", 0.25 * PPU, 0.05 * PPU);
    ctx.restore();
    // spinning checkered disc on top
    const cx = toSX(FINISH_X), cy = toSY(pTop + 2.4), R = 2.6 * PPU;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
    ctx.translate(cx, cy); ctx.rotate(st.t * 0.6);
    const n = 6, cs = (2 * R) / n * 1.42;
    for (let i = -n; i < n; i++) for (let j = -n; j < n; j++) {
      ctx.fillStyle = (i + j) & 1 ? "#ffffff" : "#111111";
      ctx.fillRect(i * cs, j * cs, cs + 0.5, cs + 0.5);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.lineWidth = lw * 1.6; ctx.strokeStyle = "#e2231a"; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R + lw * 1.2, 0, Math.PI * 2);
    ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.stroke();
  }

  // Limb rest pose in the drawing's own pixel space (912 x 912, y down)
  const POSE = {
    legL: { hip: [396, 512], knee: [215, 560], ank: [118, 732], toes: [[[-30, 18], [-70, 40], [-72, 80]], [[-6, 10], [-6, 64]], [[20, 6], [56, 34], [84, 98]]] },
    legR: { hip: [550, 516], knee: [628, 610], ank: [618, 735], toes: [[[-34, 2], [-82, 26], [-82, 68]], [[-5, 6], [-5, 60]], [[22, -2], [62, 8], [68, 72]]] },
    armL: { sh: [412, 442], el: [330, 436], hand: [258, 408], fing: [[-34, -44], [12, -58], [-40, 6], [-6, 32]] },
    armR: { sh: [556, 438], el: [650, 416], hand: [745, 390], fing: [[4, -76], [30, -14], [14, 48]] },
  };
  function curveThrough(a, k, b) {
    const c = [2 * k[0] - (a[0] + b[0]) / 2, 2 * k[1] - (a[1] + b[1]) / 2];
    ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(c[0], c[1], b[0], b[1]);
  }
  function drawCharacter() {
    if (!IMG.body.naturalWidth) return;
    const run = st.air < 0.5 ? Math.min(1, Math.abs(st.axis) * 1.4) : 0;
    const dir = st.dir;
    const ph = st.phase;
    const air = st.air;
    const vyN = Math.max(-1, Math.min(1, st.vy / CHAR.jumpSpeed));
    const bob = -Math.abs(Math.sin(ph)) * 14 * run * (1 - air);
    const lean = dir * 0.07 * run * (1 - air) + (air ? dir * 0.04 * air : 0);

    ctx.save();
    ctx.translate(toSX(st.x), toSY(st.y));
    ctx.rotate(lean);
    ctx.scale(PPU * CHAR.scale[0] / 100, PPU * CHAR.scale[1] / 100);
    ctx.translate(-456, -456);
    ctx.strokeStyle = "#111"; ctx.lineWidth = 15; ctx.lineCap = "round"; ctx.lineJoin = "round";

    const flutter = Math.sin(st.t * 17);
    function leg(L, off, side) {
      const s = Math.sin(ph + off), c = Math.cos(ph + off);
      // ground stride
      let ax = L.ank[0] + dir * s * 92 * run, ay = L.ank[1] - Math.max(0, c) * 62 * run;
      let kx = L.knee[0] + dir * s * 46 * run, ky = L.knee[1] - Math.max(0, c) * 40 * run + bob;
      // jump pose: tuck while rising, reach down while falling, little kicks throughout
      if (air > 0) {
        const up = Math.max(0, vyN), down = Math.max(0, -vyN);
        const tuckAx = L.ank[0] + (L.hip[0] - L.ank[0]) * 0.35 * up + side * 30 * down + side * flutter * 26;
        const tuckAy = L.ank[1] - 150 * up + 10 * down - flutter * side * 18;
        const tuckKx = L.knee[0] + side * 40 * up + side * 20 * down;
        const tuckKy = L.knee[1] - 70 * up;
        ax += (tuckAx - ax) * air; ay += (tuckAy - ay) * air;
        kx += (tuckKx - kx) * air; ky += (tuckKy - ky) * air;
      }
      const hip = [L.hip[0], L.hip[1] + bob];
      ctx.beginPath();
      curveThrough(hip, [kx, ky], [ax, ay]);
      const toeTilt = (air > 0 ? side * 0.25 * air : 0) + dir * s * 0.18 * run;
      const ct = Math.cos(toeTilt), sn = Math.sin(toeTilt);
      for (const toe of L.toes) {
        ctx.moveTo(ax, ay);
        for (const [tx, ty] of toe) ctx.lineTo(ax + tx * ct - ty * sn, ay + tx * sn + ty * ct);
      }
      ctx.stroke();
    }
    function arm(A, off, side) {
      const s = Math.sin(ph + off);
      let hx = A.hand[0] - dir * s * 40 * run, hy = A.hand[1] + s * side * 30 * run + bob;
      let ex = A.el[0] - dir * s * 20 * run, ey = A.el[1] + s * side * 14 * run + bob;
      if (air > 0) {
        const raise = 90 + Math.max(0, -vyN) * 40 * Math.sin(st.t * 15 + side);
        hx += (A.hand[0] + side * 10 - hx) * air; hy += (A.hand[1] - raise - hy) * air;
        ey += (A.el[1] - raise * 0.45 - ey) * air;
      }
      ctx.beginPath();
      curveThrough([A.sh[0], A.sh[1] + bob], [ex, ey], [hx, hy]);
      for (const [fx, fy] of A.fing) { ctx.moveTo(hx, hy); ctx.lineTo(hx + fx, hy + fy); }
      ctx.stroke();
    }
    leg(POSE.legL, 0, -1);
    leg(POSE.legR, Math.PI, 1);
    arm(POSE.armL, Math.PI, -1);
    arm(POSE.armR, 0, 1);
    ctx.drawImage(IMG.body, 0, bob, 912, 912);
    ctx.restore();
  }

  function drawConfetti(dt) {
    if (!confetti.length) return;
    for (const p of confetti) {
      p.vy -= 22 * dt; p.vx *= 1 - 0.8 * dt; p.vy = Math.max(p.vy, -8);
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
      ctx.save();
      ctx.translate(toSX(p.x), toSY(p.y)); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w * PPU / 2, -p.h * PPU / 2, p.w * PPU, p.h * PPU);
      ctx.restore();
    }
    confetti = confetti.filter(p => p.life > 0);
  }

  function render(dt) {
    drawWall();
    ctx.imageSmoothingEnabled = true;
    drawSprite(IMG.dirt, dirts[0].p[0], dirts[0].p[1], dirts[0].k[0], dirts[0].k[1], DIRT_SIZE);
    drawFinish();
    for (let i = 1; i < dirts.length; i++) drawSprite(IMG.dirt, dirts[i].p[0], dirts[i].p[1], dirts[i].k[0], dirts[i].k[1], DIRT_SIZE);
    for (const b of blobs) drawBlob(b);
    drawCharacter();
    drawConfetti(dt);
  }

  // ---------- Camera: deadzone + lag + look-ahead, so the hero roams the frame ----------
  function updateCamera(dt) {
    const halfW = W / 2 / PPU, halfH = H / 2 / PPU;
    st.look += ((st.axis * 3.2) - st.look) * (1 - Math.exp(-2 * dt));
    const tx = st.x + CAM_OFF[0] + st.look, ty = st.y + CAM_OFF[1] + 1.2;
    const DZX = Math.min(3, halfW * 0.25), DZY = 2.2;
    let gx = st.camX, gy = st.camY;
    if (tx > gx + DZX) gx = tx - DZX; else if (tx < gx - DZX) gx = tx + DZX;
    if (ty > gy + DZY) gy = ty - DZY; else if (ty < gy - DZY) gy = ty + DZY;
    st.camX += (gx - st.camX) * (1 - Math.exp(-3.5 * dt));
    st.camY += (gy - st.camY) * (1 - Math.exp(-2.6 * dt));
    // never let the hero leave the screen
    const mx = Math.max(1, halfW - 4), my = Math.max(1, halfH - 3.5);
    st.camX = Math.min(Math.max(st.camX, st.x - mx), st.x + mx);
    st.camY = Math.min(Math.max(st.camY, st.y - my), st.y + my);
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, MAX_DT); last = now;
    st.t += dt;
    if (running) {
      if (!st.finished) st.time += dt;
      st.acc += dt;
      let steps = 0;
      while (st.acc >= FIXED && steps < 8) { physicsStep(FIXED); st.acc -= FIXED; steps++; }
      if (steps === 8) st.acc = 0;
      const t = st.finished ? 0 : axisTarget();
      if (t !== 0) {
        if (st.axis !== 0 && Math.sign(st.axis) !== t) st.axis = 0;
        st.axis = moveTowards(st.axis, t, 3 * dt);
        st.dir = t;
      } else st.axis = moveTowards(st.axis, 0, 3 * dt);
      if (st.axis) {
        const x0 = st.x;
        st.x += st.axis * CHAR.speed * dt; resolve();
        st.phase += Math.abs(st.x - x0) * (2 * Math.PI / 3.4);
      }
      const airTarget = st.grounded ? 0 : 1;
      st.air += (airTarget - st.air) * (1 - Math.exp(-14 * dt));
      if (!st.finished && st.x + bOff[0] >= FINISH_X) finish();
      if (!st.finished) timerEl.textContent = fmt(st.time);
      updateCamera(dt);
    }
    render(dt);
    requestAnimationFrame(frame);
  }

  if (location.hash === "#bot") window.__dp = { st, solids, FINISH_X, keys, jump, begin, reset };

  window.claude?.hot?.snapshot?.(() => ({ x: st.x, y: st.y, vy: st.vy, time: st.time, running, finished: st.finished }));
  function boot(data) {
    resize();
    reset();
    if (data && typeof data.x === "number" && data.running && !data.finished) {
      running = true; startEl.hidden = true;
      st.x = data.x; st.y = data.y; st.vy = data.vy || 0; st.time = data.time || 0; snapCamera();
    }
    Promise.all(loads).then(() => requestAnimationFrame(t => { last = t; frame(t); }));
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
